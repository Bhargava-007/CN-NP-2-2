frr defaults traditional
hostname core1
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.255.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip address 10.20.255.3/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth3
 ip address 10.20.255.7/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface lo
 ip address 10.20.254.1/32
 ip ospf area 0
!
router ospf
 ospf router-id 10.20.254.1
 auto-cost reference-bandwidth 100000
 timers throttle spf 50 200 5000
 timers throttle lsa all 50

!
bfd
!
line vty
!
