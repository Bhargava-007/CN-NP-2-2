frr defaults traditional
hostname r-dc
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.255.6/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip address 10.20.255.8/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth3
 ip address 10.20.48.1/24
 ip ospf area 0.0.0.4
 ip ospf passive
!
interface lo
 ip address 10.20.254.4/32
 ip ospf area 0
!
router ospf
 ospf router-id 10.20.254.4
 auto-cost reference-bandwidth 100000
 timers throttle spf 50 200 5000
 timers throttle lsa all 50
 area 0.0.0.4 range 10.20.48.0/20
!
bfd
!
line vty
!
