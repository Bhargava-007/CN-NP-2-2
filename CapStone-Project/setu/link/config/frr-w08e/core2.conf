frr defaults traditional
hostname core2
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.255.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 ip address 10.20.255.5/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 ip address 10.20.255.9/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth4
 ip address 10.20.255.13/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth5
 description uplink to ISP2 (NAT outside)
 ip address 198.51.100.2/30
!
interface lo
 ip address 10.20.254.2/32
 ip ospf area 0
 ipv6 address 2001:db8:5e70:fe::2/128
 ipv6 ospf6 area 0
!
router bgp 64500
 bgp router-id 10.20.254.2
 no bgp ebgp-requires-policy
 neighbor 198.51.100.1 remote-as 64502
 neighbor 198.51.100.1 timers 1 3
!
router ospf
 ospf router-id 10.20.254.2
 auto-cost reference-bandwidth 100000
 timers throttle spf 50 200 5000
 timers throttle lsa all 50
 default-information originate metric 100 metric-type 1
!
router ospf6
 ospf6 router-id 10.20.254.2
!
bfd
!
line vty
!
