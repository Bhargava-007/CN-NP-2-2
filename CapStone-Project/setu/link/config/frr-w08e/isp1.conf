frr defaults traditional
hostname isp1
service integrated-vtysh-config
!
interface eth1
 description customer SETU (AS 64500)
 ip address 192.0.2.1/30
!
interface eth2
 description towards the rest of the internet
 ip address 100.64.1.1/30
!
ip route 203.0.113.0/24 100.64.1.2
!
router bgp 64501
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 64500
 neighbor 192.0.2.2 timers 1 3
 address-family ipv4 unicast
  neighbor 192.0.2.2 default-originate
 exit-address-family
!
line vty
!
