frr defaults traditional
hostname r-dc
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.255.6/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 ip address 10.20.255.8/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description DC servers 10.20.48.0/24
 ip address 10.20.48.1/24
 ip ospf area 0.0.0.4
 ip ospf passive
 ipv6 address 2001:db8:5e70:30::1/64
 ipv6 ospf6 area 0.0.0.4
 ipv6 ospf6 passive
 ipv6 nd prefix 2001:db8:5e70:30::/64
 no ipv6 nd suppress-ra
!
interface lo
 ip address 10.20.254.4/32
 ip ospf area 0
!
router ospf
 ospf router-id 10.20.254.4
 auto-cost reference-bandwidth 100000
 timers throttle spf 50 200 5000
 timers throttle lsa all 50
 area 0.0.0.4 range 10.20.48.0/20
!
router ospf6
 ospf6 router-id 10.20.254.4
 area 0.0.0.4 range 2001:db8:5e70:30::/60
!
bfd
!
line vty
!
