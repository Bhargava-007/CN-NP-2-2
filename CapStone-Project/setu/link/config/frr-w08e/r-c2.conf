frr defaults traditional
hostname r-c2
service integrated-vtysh-config
!
interface eth1
 ip address 10.20.255.10/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 ip address 10.20.255.12/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description BLD-C guest LAN 10.20.36.0/23 (VRRP virtual gateway 10.20.36.1)
 ip address 10.20.36.3/23
 ip ospf area 0.0.0.3
 ip ospf passive
 ipv6 address 2001:db8:5e70:21::3/64
 ipv6 ospf6 area 0.0.0.3
 ipv6 ospf6 passive
 ipv6 nd prefix 2001:db8:5e70:21::/64
 ipv6 nd ra-interval 3
 no ipv6 nd suppress-ra
!
interface lo
 ip address 10.20.254.5/32
 ip ospf area 0
!
router ospf
 ospf router-id 10.20.254.5
 auto-cost reference-bandwidth 100000
 timers throttle spf 50 200 5000
 timers throttle lsa all 50
 area 0.0.0.3 range 10.20.32.0/20
!
router ospf6
 ospf6 router-id 10.20.254.5
 area 0.0.0.3 range 2001:db8:5e70:20::/60
!
bfd
!
line vty
!
