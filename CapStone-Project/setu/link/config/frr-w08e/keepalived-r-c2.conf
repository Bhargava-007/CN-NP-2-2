# VRRPv3 for the BLD-C gateway pair. r-c2: priority 100 (r-c is the intended master).
# track_interface: losing BOTH uplinks costs 60 and drops r-c (150) below r-c2 (100) - criterion 5.
# Losing ONE uplink costs 30: r-c (120) stays master, correctly, because it still has a path.
global_defs {
  router_id r-c2
  vrrp_version 3
  vrrp_garp_master_delay 0
}
vrrp_instance BLDC_GW {
  state BACKUP
  interface eth3
  virtual_router_id 36
  priority 100
  advert_int 0.1
  virtual_ipaddress {
    10.20.36.1/23 dev eth3
  }
  track_interface {
    eth1 weight -30
    eth2 weight -30
  }
}
